<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCI India NEC/NGB Reporting</title>
<!-- After each update: bump ?v= on the two script tags below AND APP_VERSION in users.js.
     This forces every browser to fetch the new files instead of a cached copy. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --jci-blue:#0067B1; --navy:#0B2A4A; --gold:#F2B01E; --paper:#F4F7FA; --card:#FFF;
  --ink:#122B41; --muted:#5B7186; --line:#DDE6EE; --ok:#1E8E5A; --ok-bg:#E4F4EC;
  --miss:#C6453B; --miss-bg:#FBEAE8; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:'Archivo',sans-serif;color:var(--navy);letter-spacing:-0.01em}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--jci-blue);outline-offset:1px;border-color:var(--jci-blue)}
label{display:block;font-weight:600;font-size:12.5px;color:var(--navy);margin:12px 0 4px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}

.appbar{background:var(--navy);color:#fff;padding:0 20px}
.appbar-inner{max-width:1150px;margin:0 auto;display:flex;align-items:center;gap:14px;height:62px}
.jci-mark{width:38px;height:38px;border-radius:8px;background:var(--jci-blue);display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-weight:800;font-size:15px;color:#fff;flex-shrink:0;border-bottom:3px solid var(--gold)}
.logo-badge{background:#fff;border-radius:9px;padding:5px 9px;display:flex;align-items:center;flex-shrink:0}
.logo-badge img{height:30px;display:block}
.login-logo{height:56px;display:block;margin-bottom:18px}
.print-header{display:none}
#printArea{display:none}
.appbar .title{font-family:'Archivo';font-weight:700;font-size:16px;line-height:1.2}
.appbar .sub{font-size:11.5px;color:#9FB6CC;letter-spacing:.06em;text-transform:uppercase}
.appbar .who{margin-left:auto;text-align:right;font-size:13px}
.appbar .who .role{color:var(--gold);font-weight:600}
.btn-out{background:transparent;border:1px solid #3C5A78;color:#CBDCEC;border-radius:8px;padding:7px 14px;font-size:13px}
.btn-out:hover{border-color:#fff;color:#fff}

.wrap{max-width:1150px;margin:0 auto;padding:26px 20px 70px}
.mode-banner{background:#FFF6E0;border:1px solid #EAD08C;color:#6B5619;border-radius:8px;padding:9px 14px;font-size:13px;margin-bottom:20px}

.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,var(--navy) 0%,#0E3D6B 55%,var(--jci-blue) 100%)}
.login-card{background:#fff;border-radius:14px;padding:38px 36px;width:100%;max-width:410px;box-shadow:0 24px 60px rgba(4,20,38,.45)}
.login-card .jci-mark{width:52px;height:52px;font-size:20px;margin-bottom:18px}
.login-card h1{font-size:23px;margin-bottom:3px}
.login-card .tag{color:var(--muted);font-size:13.5px;margin-bottom:8px}
.btn-primary{background:var(--jci-blue);color:#fff;border:none;border-radius:8px;padding:12px 22px;font-size:15px;font-weight:600;margin-top:20px}
.btn-primary:hover{background:#005897}
.btn-primary.wide{width:100%}
.err{background:var(--miss-bg);color:var(--miss);border-radius:8px;padding:9px 12px;font-size:13.5px;margin-top:14px;display:none}
.login-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px}
.card h2{font-size:16px;margin-bottom:2px}
.card .lead{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.pagehead{display:flex;flex-wrap:wrap;align-items:end;gap:14px;margin-bottom:20px}
.pagehead h1{font-size:21px}
.pagehead .pick{margin-left:auto;display:flex;align-items:center;gap:8px}
.pagehead .pick select{width:150px}
.section-label{font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--jci-blue);border-left:3px solid var(--gold);padding-left:9px;margin:26px 0 10px}
.card .section-label:first-of-type{margin-top:6px}

.tscroll{overflow-x:auto}
table.ftab{border-collapse:collapse;width:100%;font-size:13px}
.ftab th{background:#EDF3F8;color:var(--navy);font-weight:600;text-align:left;padding:7px 9px;border:1px solid var(--line);white-space:nowrap;font-size:12px}
.ftab td{border:1px solid var(--line);padding:4px 6px;min-width:70px;background:#fff}
.ftab td.rowlab{font-weight:600;color:var(--navy);white-space:nowrap;background:#F8FAFC;font-size:12.5px}
.ftab td.calc{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);text-align:right;background:#F8FAFC}
.ftab input,.ftab select{border:none;border-radius:0;padding:6px;background:transparent;min-width:64px}
.ftab input:focus{outline:2px solid var(--jci-blue);outline-offset:-2px}
.ftab input[type=number]{text-align:right}
table.rtab{border-collapse:collapse;width:100%;font-size:13px}
.rtab th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:7px 9px;border:1px solid #234666;white-space:nowrap;font-size:12px}
.rtab td{border:1px solid var(--line);padding:6px 9px;background:#fff}
.rtab td.rowlab{font-weight:600;color:var(--navy);background:#F8FAFC;white-space:nowrap;font-size:12.5px}
.rtab td.n{font-family:'IBM Plex Mono',monospace;text-align:right}
.rtab td.tot{background:#FFF8E5;font-weight:600}
.rtab .pos{color:var(--ok)} .rtab .neg{color:var(--miss)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .n{font-family:'Archivo';font-weight:800;font-size:25px;color:var(--navy)}
.kpi .l{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:860px){.chart-grid{grid-template-columns:1fr}}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.chart-card h3{font-size:14px;margin-bottom:2px}
.chart-card .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.chart-box{position:relative;height:260px}

.matrix-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.matrix-row:last-child{border-bottom:none}
.area-tag{font-family:'Archivo';font-weight:700;font-size:13px;color:var(--navy);width:70px;flex-shrink:0}
.zone-chips{display:flex;flex-wrap:wrap;gap:8px}
.zchip{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;border-radius:7px;padding:5px 11px;border:1px solid;background:none}
.zchip.done{color:var(--ok);border-color:#9FD4BA;background:var(--ok-bg)}
.zchip.miss{color:var(--miss);border-color:#EBB4AE;background:var(--miss-bg)}
.zchip.draft{color:#8A6A0E;border-color:#E8CD7E;background:#FDF6E1}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn-sec{background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
.btn-sec:hover{border-color:var(--jci-blue);color:var(--jci-blue)}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted);font-size:13.5px}
.saved-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:8px;padding:11px 20px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none;z-index:50}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 16px}
.field-error{outline:2px solid var(--miss) !important;outline-offset:-2px;background:#FEF6F5}
.loaded-note{background:#E8F1F9;border:1px solid #BBD4E8;color:#0B4E7E;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px;display:none}
.field-error{outline:2px solid var(--miss) !important;outline-offset:-2px;background:#FEF6F5}
.ph-wrap{margin-top:4px}
.ph-thumb{max-width:120px;max-height:90px;border-radius:6px;border:1px solid var(--line);display:block}
input[readonly]{background:#F2F5F8;color:var(--muted);cursor:not-allowed}
.app-foot{text-align:center;font-size:12px;color:var(--muted);padding:22px 0 4px;border-top:1px solid var(--line);margin-top:26px}
.app-foot b{color:var(--navy);font-weight:600}
.hash-tool{max-width:520px;margin:60px auto;padding:0 20px}
@media (prefers-reduced-motion:no-preference){
  .view{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
@media print{
  .appbar,.toolbar,.mode-banner,.pagehead .pick,.no-print{display:none !important}
  body{background:#fff}
  /* A card holds a whole report, so it must be allowed to flow across pages.
     Keeping cards together is what pushed the first page blank; instead keep
     only the small units (rows, charts) intact. */
  .card{border:none;padding:10px 0;break-inside:auto}
  table{break-inside:auto}
  tr{break-inside:avoid}
  .chart-card,.matrix-row,.report-item{break-inside:avoid}
  .section-label{break-after:avoid;break-inside:avoid}
  h1,h2,h3{break-after:avoid}
  .wrap{padding:0;max-width:none}
  .print-header{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:16px}
  .print-header img{height:44px}
  .print-header .pt{font-family:'Archivo';font-weight:800;font-size:17px;color:var(--navy)}
  .print-header .ps{font-size:11px;color:var(--muted)}
  body.zp-print main.wrap > *{display:none !important}
  body.zp-print main.wrap > #printArea{display:block !important}
  body.zp-print main.wrap{padding:0 !important;margin:0 !important}
  body.zp-print #printArea > .card:first-child{padding-top:0 !important;margin-top:0 !important}
  #printArea .chart-grid{grid-template-columns:1fr 1fr;gap:14px}
  #printArea .chart-box{height:200px}
  .rtab th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="chart.umd.js"></script>
</head>
<body>
<div id="app"></div>
<div class="saved-toast" id="toast"></div>
<script src="users.js?v=2.3"></script>
<script src="nd.js?v=2.3"></script>
<script src="app.js?v=2.3"></script>
</body>
</html>
